<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaimTech Partners</title>
  <meta name="description" content="NaimTech Partners" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=20260503c" />
  <link rel="shortcut icon" type="image/png" href="./favicon-32.png?v=20260503c" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-180.png?v=20260503c" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b1020;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .frame-wrap {
      width: 100%;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="frame-wrap">
    <iframe
      id="partner-app-frame"
      title="NaimTech Partners"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
      allow="clipboard-write"
    ></iframe>
  </div>
  <script>
    (function () {
      var iframe = document.getElementById('partner-app-frame');
      if (!iframe) return;

      var appUrl = new URL('https://script.google.com/macros/s/AKfycbzRU28BHdPoxo_AroG5U7mt0lUJUPugEPCoM1pF70sylaxRuocsErlEmS-XXBp70a8ryA/exec');
      var wrapperUrl = new URL(window.location.href);

      if (wrapperUrl.search) {
        appUrl.search = wrapperUrl.search;
      }

      iframe.src = appUrl.toString();

      if (wrapperUrl.searchParams.has('login_token')) {
        wrapperUrl.searchParams.delete('login_token');
        var nextUrl =
          wrapperUrl.pathname +
          (wrapperUrl.search ? wrapperUrl.search : '') +
          (wrapperUrl.hash ? wrapperUrl.hash : '');
        window.history.replaceState(null, '', nextUrl);
      }
    })();
  </script>
</body>
</html>
